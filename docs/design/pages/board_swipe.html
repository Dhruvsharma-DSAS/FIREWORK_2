<!doctype html><html><head><!--HEAD--></head><body>
<div class="app" id="app" style="width:1900px; height:420px; padding:20px; display:flex; gap:16px"></div>
<script>(async function(){ await KIT.loadWorld(); const app=document.getElementById("app"); const pos=[0.15,0.5,0.85]; const cap=["Handle at 15%: mostly VIIRS — many small detections","Handle at 50%: same fires, two rulers","Handle at 85%: mostly MODIS — fewer, bigger pixels"];
for(let i=0;i<3;i++){ app.insertAdjacentHTML("beforeend",'<div class="panel" style="width:610px; height:380px; position:relative; overflow:hidden"><svg id="a'+i+'" style="position:absolute;left:0;top:0"></svg><div style="position:absolute; left:'+(610*pos[i])+'px; top:0; right:0; bottom:0; overflow:hidden"><svg id="b'+i+'" style="position:absolute; left:-'+(610*pos[i])+'px; top:0"></svg></div><div style="position:absolute; left:'+(610*pos[i]-2)+'px; top:0; bottom:0; width:4px; background:#EEF2FA"></div><div class="chip" style="position:absolute; left:12px; top:10px; background:rgba(6,10,19,.7)">Frame '+(i+1)+'</div><div style="position:absolute; left:12px; bottom:10px; font-size:13px; background:rgba(6,10,19,.7); padding:4px 8px; border-radius:8px">'+cap[i]+'</div></div>');
 await KIT.region("#a"+i,{w:610,h:380,sensorFilter:"MODIS",pointSize:2.2}); await KIT.region("#b"+i,{w:610,h:380,sensorFilter:"VIIRS",pointSize:1.8}); }
window.READY=true; })();</script></body></html>
