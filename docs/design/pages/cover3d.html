<!doctype html><html><head><!--HEAD-->
<style>
.hero-h{font-family:"Inter";font-weight:400;font-size:84px;line-height:0.98;letter-spacing:-0.035em}
.hero-h em{font-family:"Fraunces";font-style:italic;font-weight:400;color:var(--flame)}
.glass{background:rgba(10,16,32,0.42);border:1px solid rgba(180,200,255,0.16);border-radius:16px;backdrop-filter:blur(16px)}
.pill{display:inline-flex;align-items:center;gap:12px;padding:10px 10px 10px 20px;border-radius:999px;border:1px solid rgba(220,230,255,0.28);font-family:"SG";font-weight:700;font-size:12px;letter-spacing:.12em}
.pill i{width:30px;height:30px;border-radius:50%;background:#fff;color:#0A1020;display:grid;place-items:center;font-style:normal;font-size:15px}
.tel .kv{border-bottom:1px dashed rgba(150,180,255,.12);font-size:12px;padding:6px 0}
.vline{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(transparent,rgba(150,180,255,.10),transparent)}
</style></head><body><div class="app" id="app" style="background:#03060d;width:1485px;height:1050px"><canvas id="c" style="position:absolute;inset:0;width:1485px;height:1050px"></canvas><div id="flare" style="position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;mix-blend-mode:screen">
    <div style="position:absolute;left:-420px;top:-420px;width:840px;height:840px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,200,.95) 0%,rgba(255,196,120,.55) 4%,rgba(255,150,70,.22) 14%,rgba(120,170,255,.10) 32%,rgba(0,0,0,0) 60%)"></div>
    <div style="position:absolute;left:-700px;top:-2px;width:1400px;height:4px;background:linear-gradient(90deg,transparent,rgba(255,230,190,.55),transparent);filter:blur(1px)"></div>
    <div style="position:absolute;left:-1px;top:-120px;width:2px;height:240px;background:linear-gradient(transparent,rgba(255,230,190,.35),transparent)"></div>
    <div style="position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 30px 12px rgba(255,240,210,.9)"></div>
  </div>
  <svg style="position:absolute;left:0;top:0;pointer-events:none" width="1485" height="1050"><path id="lead" d="" fill="none"/><circle id="leaddot" r="0"/></svg><svg id="mini" width="1" height="1" style="display:none"></svg><svg id="logo" style="display:none"></svg></div><script type="module">
import {scene, llToVec} from "/earth3d.js";
KIT.logo("#logo", 34);
const rng = KIT.rng(7); const fires = [];
const C = [[30.6,75.4,1.1,180],[29.8,76.4,0.9,120],[30.9,74.6,0.7,90],[26.5,80.5,1.6,60],[22.5,82.0,1.5,50],[18.5,80.5,1.3,40],[24.5,93.5,1.0,50]];
for (const c of C) for (let i = 0; i < c[3]; i++) { const r = Math.sqrt(-2*Math.log(rng()+1e-9))*c[2]*0.5, t = rng()*6.283; fires.push([c[0]+r*Math.sin(t), c[1]+r*Math.cos(t), rng()<0.25?"#ffd27a":"#ff5a2a"]); }
const sun = llToVec(5, 78+112, 1);
const q = new URLSearchParams(location.search); const g = (k,d) => q.has(k) ? +q.get(k) : d;
const S = await scene(document.getElementById("c"), {w:1485,h:1050,camLL:[g("clat",12),g("clon",77)],camDist:g("d",23),look:[0,0,0],shift:[g("sx",-260),g("sy",-430)],sun:[sun.x,sun.y,sun.z],sunCam:[g("ux",0.62),g("uy",0.30),g("uz",-1)],fov:40,nightBoost:3.2,fires,fireSize:0.12,exposure:1.15,
  satCam:[{at:[g("x",0.95),g("y",0.55),g("z",-4.8)],rot:[0.75,-0.5,-0.62],scale:g("s",0.13),tilt:0.15,env:0.8}]});
const fl = document.getElementById("flare"); fl.style.left = g("fx",1330)+"px"; fl.style.top = g("fy",250)+"px";
console.log("SUN", JSON.stringify(window.SUN_SCREEN), "EARTH", JSON.stringify(window.EARTH_SCREEN));
const mini = d3.select("#mini"); const pr = d3.geoMercator().center([76,29.5]).scale(1300).translate([65,65]);
await KIT.loadWorld(); const world = {land: KIT.land, borders: KIT.borders}; const path = d3.geoPath(pr);
mini.append("path").attr("d", path(world.land)).attr("fill","#18233d").attr("stroke","#2b3a5e");
mini.append("path").attr("d", path(world.borders)).attr("fill","none").attr("stroke","#40507a").attr("stroke-width",0.6);
fires.slice(0,390).forEach(f => { const p = pr([f[1],f[0]]); if (p[0]>0&&p[0]<130&&p[1]>0&&p[1]<130) mini.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",1.4).attr("fill",f[2]).attr("opacity",.85); });
const P0=[-0.15,1.75,-4.8], P1=[0.7,1.5,-4.8], P2=[2.2,0.95,-4.8];
function bez(t){ const u=1-t; return [0,1,2].map(i=>u*u*P0[i]+2*u*t*P1[i]+t*t*P2[i]); }
window.frameAt = function(t){ S.place(0, bez(t), [0.75+0.25*Math.sin(t*3.1), -0.5+0.3*t, -0.62+0.1*t]); S.render();
  const v = S.sats[0].sat.position.clone().project(S.cam); const sx = (v.x+1)/2*1485, sy = (1-v.y)/2*1050;
  document.getElementById('lead').setAttribute('d', 'M1352 430 L1320 430 L'+sx.toFixed(0)+' '+sy.toFixed(0)); const d=document.getElementById('leaddot'); d.setAttribute('cx',sx); d.setAttribute('cy',sy);
  const fl=document.getElementById("flare"); fl.style.opacity = 0.85+0.15*Math.sin(t*6.283*2); };
if (q.has("t")) frameAt(+q.get("t"));
if (q.has("live")) { const t0=performance.now(); const loop=(now)=>{ frameAt(((now-t0)/24000)%1); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
window.READY = true;
</script></body></html>
